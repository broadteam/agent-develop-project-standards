name: Standards CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks
        run: |
          node --check init.cjs
          node --check template/scripts/check-governance.cjs
          node --check template/scripts/generate-board.cjs
          python -m py_compile template/scripts/check_governance.py
      - name: Regression tests
        run: |
          node tests/test-init.cjs
          node tests/test-parity.cjs
