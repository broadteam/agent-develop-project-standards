name: Standards CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Cover the declared minimum and the current release, on both platforms.
        # Declaring a floor that CI never runs is how "supported" quietly becomes a guess.
        node: [22, 24]
        python: ['3.11', '3.13']
    name: ${{ matrix.os }} · node ${{ matrix.node }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax checks
        run: |
          node --check init.cjs
          node --check tools/check-template-drift.cjs
          node --check tools/adopt-template-baseline.cjs
          node --check tools/plan-template-upgrade.cjs
          node --check tools/validate-template-upgrade-review.cjs
          node --check tools/record-reviewed-template-upgrade.cjs
          node --check tools/template-source-inventory.cjs
          node --check template/.standards/check-governance.cjs
          node --check template/.standards/traceability-check.cjs
          node --check template/.standards/profile-validator.cjs
          node --check template/.standards/capability-resolver.cjs
          node --check template/.standards/task-context-resolver.cjs
          node --check template/.standards/generate-board.cjs
          python -c "import ast, pathlib; files=['template/.standards/check_governance.py','template/.standards/profile_validator.py','template/.standards/traceability_check.py']; [ast.parse(pathlib.Path(f).read_text(encoding='utf-8'), filename=f) for f in files]"
      - name: Regression tests
        env:
          PYTHONUTF8: '1'
        run: |
          node tests/test-init.cjs
          node tests/test-capability-resolver.cjs
          node tests/test-task-context-resolver.cjs
          node tests/test-intent-continuity.cjs
          node tests/test-intent-continuity-simulation.cjs
          node tests/test-traceability-contract.cjs
          node tests/test-traceability-governance.cjs
          node tests/test-parity.cjs
          node tests/test-policy.cjs
          node tests/test-memory-mirror.cjs
          node tests/test-pitfalls-split.cjs
          node tests/test-v2-spec.cjs
          node tests/test-client-adapters.cjs
          node tests/test-migration-v2.cjs
          node tests/test-template-drift.cjs
          node tests/test-template-upgrade-plan.cjs
          node tests/test-template-upgrade-review.cjs
          node tests/test-template-upgrade-recovery.cjs
          node tests/test-template-upgrade-record.cjs
          node tests/test-doc-links.cjs
